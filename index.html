<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Presupuesto para Estudiantes</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-wallet"></i> Budget<span>Student</span></h1>
            <p>Controla tus finanzas, alcanza tus metas.</p>
        </header>

        <!-- Dashboard -->
        <section class="dashboard">
            <div class="card balance">
                <h3>Balance Total</h3>
                <p id="balance-amount">$0.00</p>
            </div>
            <div class="card income">
                <h3><i class="fas fa-arrow-up"></i> Ingresos</h3>
                <p id="income-amount">$0.00</p>
            </div>
            <div class="card expense">
                <h3><i class="fas fa-arrow-down"></i> Gastos</h3>
                <p id="expense-amount">$0.00</p>
            </div>
        </section>

        <!-- Budget Progress -->
        <section class="budget-progress-container">
            <div class="progress-info">
                <span>Uso del Presupuesto</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progress-bar-fill" class="progress-bar-fill"></div>
            </div>
            <p id="budget-warning" class="warning-text" style="display: none;">
                <i class="fas fa-exclamation-triangle"></i> ¡Cuidado! Has superado el 80% de tus ingresos.
            </p>
        </section>

        <main class="main-content">
            <!-- Form Section -->
            <section class="form-section">
                <h2>Nueva Transacción</h2>
                <form id="transaction-form">
                    <div class="form-group">
                        <label for="description">Descripción</label>
                        <input type="text" id="description" placeholder="Ej: Apuntes de historia" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="amount">Monto ($)</label>
                            <input type="number" id="amount" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label for="type">Tipo</label>
                            <select id="type">
                                <option value="income">Ingreso</option>
                                <option value="expense" selected>Gasto</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="category">Categoría</label>
                        <select id="category">
                            <option value="Educación">Educación</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Comida">Comida</option>
                            <option value="Ocio">Ocio</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit">Agregar Transacción</button>
                </form>
            </section>

            <!-- History Section -->
            <section class="history-section">
                <div class="history-header">
                    <h2>Historial</h2>
                    <div class="filters">
                        <button class="filter-btn active" data-filter="all">Todos</button>
                        <button class="filter-btn" data-filter="income">Ingresos</button>
                        <button class="filter-btn" data-filter="expense">Gastos</button>
                    </div>
                </div>
                <ul id="transaction-list" class="transaction-list">
                    <!-- List items will be added here via JS -->
                </ul>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
